# conf.d/*.conf 由官方镜像在 http {} 块内 include，因此这里可以写 map。
# socket.io 的 WebSocket 升级需要按请求转发 Connection 头：
# 走 websocket 传输时为 upgrade，回落到 polling（普通 HTTP）时必须为 close。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTTPS 由外层的 nginx-proxy-manager 终止，这里始终是明文 HTTP。
  # 真实协议通过 NPM 传入的 X-Forwarded-Proto 透传给房间服务。
  #
  # 客户端真实 IP 的归一化。
  # 只信任私网来源（nginx-proxy-manager 一定在 docker 网段或内网）转发的 X-Forwarded-For；
  # 若有人绕过 NPM 直接打到本容器的公网端口，其伪造的 X-Forwarded-For 会被忽略。
  # real_ip_recursive off 表示取 X-Forwarded-For 里最右侧的地址，
  # 也就是上一跳（NPM）实际看到的连接来源，客户端无法通过多塞几个地址来伪造。
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # Docker 内嵌 DNS。配合 proxy_pass 里的变量，让上游地址在请求时解析，
  # 这样 room-server 容器重建换 IP 后不需要重启 web 容器，
  # 也不会因为启动顺序导致 nginx 因解析不到主机名而起不来。
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 任务页「按图搜索」：请求体是多张 base64 截图，响应要等大模型出结果，
  # 因此体积和超时都必须比其他 /api/ 接口宽。用 ^~ 抢在 /api/ 之前匹配。
  # client_max_body_size 与 room-server 里 /api/tasks 的 express.json limit 保持一致；
  # proxy_read_timeout 要大于 zhipu.ts 的 REQUEST_TIMEOUT_MS（120s）。
  location ^~ /api/tasks/ {
    set $tasks_api room-server:3001;
    proxy_pass http://$tasks_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 16m;
    # 大请求体直接转发，不落磁盘缓冲
    proxy_request_buffering off;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    gzip off;
  }

  # 房间服务：注册 / 登录 / 会话刷新
  location /api/ {
    set $room_api room-server:3001;
    proxy_pass http://$room_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖而非追加：交给应用的 X-Forwarded-For 里永远只有一个、已归一化的客户端 IP，
    # 应用侧固定按「1 层代理」处理即可，不需要去数前面究竟有几层反代。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    # 请求体只有 JSON，限制大小以缩小攻击面
    client_max_body_size 64k;
    proxy_read_timeout 30s;
    gzip off;
  }

  # 房间服务：socket.io 端点（与前端 roomSocket.ts 里的 path: '/ws' 对应）
  location /ws {
    set $room_ws room-server:3001;
    proxy_pass http://$room_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # 长连接：默认 60s 会把空闲的 WebSocket 掐断
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 实时消息不能被缓冲
    proxy_buffering off;
    gzip off;
  }

  # Vite 带 hash 的产物：内容变则文件名变，可长期缓存
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 无 hash 的 public 资源（地图、图标、字体）
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # PWA manifest：官方 mime.types 里没有 .webmanifest，
  # 不显式声明会以 application/octet-stream 返回，Chrome 直接判为无效清单。
  # 同时必须落到这个 location 而不是被 SPA fallback 吞成 index.html。
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # 避免缓存 HTML，保证发版后立刻生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA：未知路径回退到 index.html（react-router）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
